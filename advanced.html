<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Advanced Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">Google Search</a>
    <a href="image.html">Images</a>
  </nav>

  <header class="advanced-header">
    <h1>Advanced Search</h1>
  </header>

  <main class="advanced-main">
    <h2>Find pages with...</h2>
    <form action="https://www.google.com/search" method="GET">
      <div class="advanced-row">
        <label for="all-words">all these words:</label>
        <input id="all-words" type="text" name="as_q">
      </div>
      <div class="advanced-row">
        <label for="exact-phrase">this exact word or phrase:</label>
        <input id="exact-phrase" type="text" name="as_epq">
      </div>
      <div class="advanced-row">
        <label for="any-words">any of these words:</label>
        <input id="any-words" type="text" name="as_oq">
      </div>
      <div class="advanced-row">
        <label for="none-words">none of these words:</label>
        <input id="none-words" type="text" name="as_eq">
      </div>
      <div class="advanced-submit">
        <input type="submit" value="Advanced Search">
      </div>
    </form>
  </main>
</body>
</html>
